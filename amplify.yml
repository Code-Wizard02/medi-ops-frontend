version: 1
frontend:
  phases:
    preBuild:
      commands:
        - FLUTTER_HOME="$HOME/flutter"
        - if [ ! -d "$FLUTTER_HOME" ]; then git clone https://github.com/flutter/flutter.git -b stable "$FLUTTER_HOME"; fi
        - export PATH="$PATH:$FLUTTER_HOME/bin"
        - flutter precache --web
        - flutter pub get
    build:
      commands:
        - export PATH="$PATH:$HOME/flutter/bin"
        - flutter build web --release --dart-define=API_BASE_URL=$API_BASE_URL
  artifacts:
    baseDirectory: build/web
    files:
      - '**/*'
  cache:
    paths:
      - '$HOME/flutter/**/*'
      - '$HOME/.pub-cache/**/*'