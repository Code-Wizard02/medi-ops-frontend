version: 1
frontend:
  phases:
    preBuild:
      commands:
        - flutter clean
        - flutter pub get
    build:
      commands:
        - flutter build web --release --dart-define=API_BASE_URL=$API_BASE_URL
  artifacts:
    baseDirectory: build/web
    files:
      - '**/*'
  cache:
    paths:
      - '.pub-cache/**/*'